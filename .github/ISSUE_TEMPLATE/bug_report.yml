name: 安装或运行问题 / Bug report
description: 报告可复现的问题，请勿上传登录信息或聊天隐私。
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿提交二维码、token、Cookie、请求头、数据目录、浏览器 profile 或真实聊天历史。
        / Do not attach credentials, QR codes, browser profiles, or private chat history.
  - type: input
    id: version
    attributes:
      label: 项目版本或提交号 / Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与 Node 版本 / OS and Node version
      placeholder: Windows 11, Node 22.x
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 哪一步失败？ / Failing step
      options:
        - 安装 / Installation
        - ChatGPT 登录 / ChatGPT login
        - 微信扫码 / WeChat pairing
        - 命令回复 / Commands
        - 普通问答 / Conversation
        - 停止或重启 / Stop or restart
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤与期望结果 / Steps and expected result
      description: 使用合成文字复现，省略个人会话链接。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏错误码 / Actual result and sanitized error
      description: 不要粘贴完整日志包、请求头或聊天内容。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查 / Privacy check
      options:
        - label: 我已移除凭据、二维码和私人聊天信息 / I removed credentials, QR codes, and private chats.
          required: true
